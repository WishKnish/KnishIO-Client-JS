# nodeLinker: yarn 4 defaults to PnP, which would silently wipe node_modules (July 2026 lesson).
nodeLinker: node-modules

# ChainDrop response (2026-08): quarantine npm versions younger than 7 days (unit: minutes).
# This repo is a standalone clone in CI, so the key must live HERE, not only in the
# monorepo root's .yarnrc.yml. Release-day escape: YARN_NPM_MINIMAL_AGE_GATE=0 yarn <cmd>.
npmMinimalAgeGate: 10080

yarnPath: .yarn/releases/yarn-4.15.0.cjs
