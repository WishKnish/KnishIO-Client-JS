# JS SDK publish — tag-driven npm publish via Trusted Publishing / OIDC (cycle 177).
# Push a version tag (JS uses the `v` prefix, e.g. `v0.9.1`) → build/test gate → `npm publish`.
#
# Auth = npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN. One-time maintainer setup:
#   npmjs.com → the `@wishknish/knishio-client-js` package → Settings → Trusted Publisher →
#   GitHub Actions: organization `WishKnish`, repository `KnishIO-Client-JS`, workflow `publish.yml`.
#   (All fields case-sensitive; npm validates them only at publish time.)
# Requires npm >= 11.5.1 + Node >= 22.14 (we use Node 24 + `npm install -g npm@latest`). Provenance
# attestations are generated automatically under trusted publishing.
name: Publish

on:
  push:
    tags:
      - 'v*'
  # Dry run. This workflow is otherwise reachable only by pushing a tag, which publishes — so
  # every change to it would ship unexercised. A dispatch runs the version gate and the full
  # lint/test/build path and stops before publishing, because the publish job is guarded on
  # `github.event_name == 'push'`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run the gate against, e.g. v0.9.3. Publishes NOTHING.'
        required: true
        type: string

permissions:
  id-token: write   # OIDC for npm Trusted Publishing
  contents: write   # create the GitHub Release

jobs:
  # Split out of the publish job on purpose: `environment: release` is a deployment gate that
  # can require approval, and a dry run that uploads nothing should not have to pass it.
  verify:
    name: verify version + lint + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Refuse to publish a tag the manifest does not itself claim. This repo tags with a
      # leading `v`; check-version.sh strips it. Shared definition with ci.yml and with local
      # runs — see .github/scripts/check-version.sh.
      - name: Verify tag matches the declared SDK version
        # DISPATCH_TAG arrives via env, never interpolated into the shell text
        # (workflow-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED="${GITHUB_REF#refs/tags/}"
          else
            EXPECTED="$DISPATCH_TAG"
          fi
          bash .github/scripts/check-version.sh "$EXPECTED"

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5 enables package-manager caching by default (v4 did not) and hard
          # fails when no lockfile is present. This repo gitignores both lockfiles and
          # installs with `npm install`, so there is nothing to cache against.
          package-manager-cache: false

      # Mirrors ci.yml: npm install (tolerant of the yarn/npm lockfile coexistence).
      - name: Install dependencies
        run: npm install

      # Gate — never publish a tag that doesn't lint/test/build clean.
      - name: ESLint (lint gate)
        run: npm run lint

      - name: Jest
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: publish to npm (Trusted Publishing)
    needs: verify
    if: github.event_name == 'push'   # dispatch = dry run; never publishes
    runs-on: ubuntu-latest
    environment: release   # matches the npm trusted-publisher Environment + the repo's `release` env
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5 enables package-manager caching by default (v4 did not) and hard
          # fails when no lockfile is present. This repo gitignores both lockfiles and
          # installs with `npm install`, so there is nothing to cache against.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (newer than the bundled npm).
      - name: Upgrade npm (>= 11.5.1 for trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # OIDC trusted publishing: no NODE_AUTH_TOKEN; npm authenticates via the id-token and
      # auto-generates provenance. --access public keeps the scoped package public.
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
