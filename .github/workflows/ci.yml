# JS SDK CI — enforces the ESLint gate (restored cycle 11) + the jest suite.
# Born-enforced: the repo had no CI, so the lint gate was local-only/bypassable until now.
#
# Supply-chain hardening (ChainDrop response, 2026-08):
# - persist-credentials: false on every checkout — no workflow here pushes, and the
#   ChainDrop worm reads the checkout token straight out of .git/config.
# - Dependency resolution is SCRIPT-FREE and COOLDOWN-GATED: the resolve step writes a
#   lockfile without executing anything (--package-lock-only --ignore-scripts) and
#   refuses versions younger than 7 days (--before), so a freshly-published malicious
#   version can neither run code at install time nor be selected at all.
# - The real install is `npm ci --ignore-scripts` against that resolved set. If a dep
#   genuinely needs its build script, add a NAMED `npm rebuild <pkg>` step — never
#   re-enable scripts wholesale.
# - Cooldown valve: --before also delays legitimate FIXES younger than 7 days. If the
#   audit step reds on a fix inside the cooldown, review that version manually (publish
#   date + provenance) and adjust the resolve pin — do not drop the flag.
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. The publish workflow already
  # refuses a tag that disagrees with the manifest, but that only fires on a tag push, so
  # drift can sit in master until release day. Same script, no expected version: assert only
  # that the repo agrees with itself.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Prove the checkout kept no credential: with persist-credentials: false the
      # extraheader must be absent. A malicious dependency script (the ChainDrop vector)
      # would otherwise find a live repo-scoped token here.
      - name: Assert no persisted git credential
        run: |
          if git config --local --get http.https://github.com/.extraheader; then
            echo "::error::checkout persisted a credential despite persist-credentials: false"
            exit 1
          fi
          echo "OK: no credential in .git/config"

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          # setup-node v5 turns package-manager caching ON by default (v4 did not), and it
          # HARD FAILS when it cannot find a lockfile: "Dependencies lock file is not found".
          # This repo gitignores both lockfiles on purpose (see below), so there is nothing
          # to cache against. Committing .yarnrc.yml for Yarn Berry is what makes v5 detect
          # yarn and go looking for yarn.lock at all.
          package-manager-cache: false

      # No lockfile is committed (both npm and yarn locks are gitignored); this resolves
      # fresh and writes an ephemeral package-lock.json WITHOUT executing any lifecycle
      # script (--package-lock-only overrides the .npmrc package-lock=false guard), and
      # refuses any version published in the last 7 days.
      - name: Resolve dependencies (script-free, 7-day cooldown)
        run: npm install --package-lock-only --ignore-scripts --before="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"

      # Dependency audit gate: fail on high/critical advisories in the published
      # dependency tree (dev tooling is reported by the full audit but not enforced).
      # Reads the lockfile written above — no install needed.
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # Install exactly the resolved set, still without lifecycle scripts. Platform
      # binaries (@swc, rolldown) arrive as optionalDependencies and need no scripts.
      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      # The enforced lint gate (eslint.config.js, ESLint 9 flat config): 0 errors (warnings allowed).
      - name: ESLint (lint gate)
        run: npm run lint

      # Build gate: this job ran lint + jest but never `npm run build`, so the vite 8
      # major landed green and only broke at build time (vite 8 no longer bundles
      # esbuild). vite is the sole build tool and prepublishOnly runs it, so a broken
      # build would otherwise first surface during publish.
      - name: Build (vite)
        run: npm run build

      # jest unit suite (incl. the cross-SDK canonical-vector parity tests). The
      # live-validator integration suite auto-skips without KNISHIO_TEST_URI.
      - name: Jest
        run: npm test

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have. persist-credentials: false — the diff below reads
      # local objects only; no credential is needed after clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # If package.json's version changed relative to the base commit, CHANGELOG.md
      # must carry a matching `## [<version>]` heading. No version change → no-op.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
          git show "$BASE:package.json" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver package.json); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
